name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Europe-scale multiresolution benchmark
        if: matrix.compiler == 'gcc'
        run: ./build/worldsim_multiresolution_water_benchmark
      - name: Europe-scale weather benchmark
        if: matrix.compiler == 'gcc'
        run: ./build/worldsim_weather_benchmark
      - name: Europe-scale simulation checkpoint benchmark
        if: matrix.compiler == 'gcc'
        run: ./build/worldsim_simulation_benchmark

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  windows-shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure shared MSVC build
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=ON '-DCMAKE_C_FLAGS=/WX' '-DCMAKE_CXX_FLAGS=/WX /EHsc'
      - name: Build
        run: cmake --build build --config Release
      - name: Test shared library consumers
        run: ctest --test-dir build -C Release --output-on-failure

  godot-observer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.5.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo 'e3ce6194b6d4d2dcef5e5b5136752c084d9d8b9071c10bc2d2011b947ec7439a257c8d23c541cb30699f16d9edea6dff36e6e84d2bec14a8fe9b4e9aacbe5a8d  /tmp/godot.zip' | sha512sum --check
          unzip -q /tmp/godot.zip -d /tmp/worldsim-godot
          chmod +x /tmp/worldsim-godot/Godot_v4.5.2-stable_linux.x86_64
      - name: Configure observer
        run: >-
          cmake --preset godot -DCMAKE_C_FLAGS=-Werror -DCMAKE_CXX_FLAGS=-Werror
          -DWORLDSIM_GODOT_EXECUTABLE=/tmp/worldsim-godot/Godot_v4.5.2-stable_linux.x86_64
      - name: Build observer and simulation
        run: cmake --build --preset godot
      - name: Test simulation and real Godot integration
        run: ctest --preset godot
