name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Europe-scale multiresolution benchmark
        if: matrix.compiler == 'gcc'
        run: ./build/worldsim_multiresolution_water_benchmark
      - name: Europe-scale weather benchmark
        if: matrix.compiler == 'gcc'
        run: ./build/worldsim_weather_benchmark

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  windows-static-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure static MSVC Release build
        run: cmake -S . -B build-static '-DCMAKE_CXX_FLAGS=/WX /EHsc'
      - name: Build core world test
        run: cmake --build build-static --config Release --target worldsim_tests
      - name: Run core world test
        run: ctest --test-dir build-static -C Release -R '^worldsim_tests$' --output-on-failure

  windows-debug-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure static MSVC Debug runtime-check build
        run: cmake -S . -B build-debug '-DCMAKE_CXX_FLAGS=/EHsc'
      - name: Build core world test
        run: cmake --build build-debug --config Debug --target worldsim_tests
      - name: Run core world test with MSVC runtime checks
        run: ctest --test-dir build-debug -C Debug -R '^worldsim_tests$' --output-on-failure

  windows-shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure shared MSVC build
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=ON '-DCMAKE_C_FLAGS=/WX' '-DCMAKE_CXX_FLAGS=/WX /EHsc'
      - name: Build
        run: cmake --build build --config Release
      - name: Prepare legacy C test temp root
        shell: pwsh
        run: New-Item -ItemType Directory -Force /tmp | Out-Null
      - name: Test shared library consumers
        run: ctest --test-dir build -C Release --output-on-failure
